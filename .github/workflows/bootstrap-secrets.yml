name: Bootstrap Secrets

on:
  workflow_dispatch:
    inputs:
      ssh_host:
        description: 'SSH Host (e.g., 49.13.52.51)'
        required: true
        default: '49.13.52.51'
      ssh_user:
        description: 'SSH User (e.g., root)'
        required: true
        default: 'root'
      ssh_password:
        description: 'SSH Password'
        required: true
      setup_type:
        description: 'Setup type'
        required: true
        default: 'deploy_now'
        type: choice
        options:
          - deploy_now
          - setup_secrets_only

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup secrets using GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_HOST: ${{ github.event.inputs.ssh_host }}
          SSH_USER: ${{ github.event.inputs.ssh_user }}
          SSH_PASSWORD: ${{ github.event.inputs.ssh_password }}
        run: |
          echo "Setting up repository secrets..."

          # Install dependencies
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip libsodium-dev
          pip3 install PyNaCl requests

          # Create Python script to set secrets
          cat > /tmp/set_secrets.py << 'EOFPYTHON'
          import os
          import requests
          import base64
          from nacl import encoding, public

          def get_public_key(repo, token):
              url = f"https://api.github.com/repos/{repo}/actions/secrets/public-key"
              headers = {
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
              response = requests.get(url, headers=headers)
              response.raise_for_status()
              return response.json()

          def encrypt_secret(public_key: str, secret_value: str) -> str:
              public_key_obj = public.PublicKey(public_key.encode("utf-8"), encoding.Base64Encoder())
              sealed_box = public.SealedBox(public_key_obj)
              encrypted = sealed_box.encrypt(secret_value.encode("utf-8"))
              return base64.b64encode(encrypted).decode("utf-8")

          def set_secret(repo, token, secret_name, secret_value, key_id, public_key):
              url = f"https://api.github.com/repos/{repo}/actions/secrets/{secret_name}"
              headers = {
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
              encrypted_value = encrypt_secret(public_key, secret_value)
              data = {
                  "encrypted_value": encrypted_value,
                  "key_id": key_id
              }
              response = requests.put(url, headers=headers, json=data)
              response.raise_for_status()
              return response.status_code

          def main():
              token = os.environ.get("GITHUB_TOKEN")
              repo = os.environ.get("GITHUB_REPOSITORY")

              secrets_to_set = {
                  "SSH_HOST": os.environ.get("SSH_HOST"),
                  "SSH_USER": os.environ.get("SSH_USER"),
                  "SSH_PASSWORD": os.environ.get("SSH_PASSWORD")
              }

              print(f"Setting up secrets for {repo}...")
              key_data = get_public_key(repo, token)
              key_id = key_data["key_id"]
              public_key = key_data["key"]

              for name, value in secrets_to_set.items():
                  if value:
                      print(f"Setting {name}...")
                      set_secret(repo, token, name, value, key_id, public_key)
                      print(f"✓ {name} set successfully")

              print("\n✓ All secrets configured!")

          if __name__ == "__main__":
              main()
          EOFPYTHON

          # Run the script
          python3 /tmp/set_secrets.py

          echo ""
          echo "✓ Secrets have been configured successfully!"
          echo ""

      - name: Deploy application (if requested)
        if: github.event.inputs.setup_type == 'deploy_now'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ github.event.inputs.ssh_host }}
          username: ${{ github.event.inputs.ssh_user }}
          password: ${{ github.event.inputs.ssh_password }}
          script: |
            set -e

            echo "Setting up server environment..."

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
              rm get-docker.sh
              systemctl enable docker
              systemctl start docker
            fi

            # Install git if not present
            if ! command -v git &> /dev/null; then
              echo "Installing git..."
              apt-get update -qq
              apt-get install -y git
            fi

            # Create app directory
            mkdir -p /opt/hello-world-app
            cd /opt/hello-world-app

            # Clone/pull latest code
            if [ -d .git ]; then
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
              git pull origin ${{ github.ref_name }}
            else
              git clone https://github.com/${{ github.repository }} .
              git checkout ${{ github.ref_name }}
            fi

            # Stop and remove existing container
            echo "Stopping existing container..."
            docker stop hello-world-app 2>/dev/null || true
            docker rm hello-world-app 2>/dev/null || true

            # Build new image
            echo "Building Docker image..."
            docker build -t hello-world-app:latest .

            # Run new container
            echo "Starting application..."
            docker run -d \
              --name hello-world-app \
              --restart unless-stopped \
              -p 80:3000 \
              hello-world-app:latest

            # Verify deployment
            echo "Verifying deployment..."
            sleep 3
            if docker ps | grep -q hello-world-app; then
              echo "✓ Deployment successful!"
              docker ps | grep hello-world-app
            else
              echo "✗ Deployment failed!"
              docker logs hello-world-app 2>/dev/null || true
              exit 1
            fi

            echo ""
            echo "========================================="
            echo "Application deployed successfully!"
            echo "Access it at: http://${{ github.event.inputs.ssh_host }}"
            echo "========================================="

      - name: Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.setup_type }}" == "deploy_now" ]; then
            echo "✓ Secrets configured" >> $GITHUB_STEP_SUMMARY
            echo "✓ Application deployed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 Your application is now live at:" >> $GITHUB_STEP_SUMMARY
            echo "### http://${{ github.event.inputs.ssh_host }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✓ Secrets configured" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Next steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
            echo "2. Run 'Deploy to Server' workflow" >> $GITHUB_STEP_SUMMARY
          fi
